<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>提出物確認画面</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>④提出物確認画面</h1>

  <!-- 提出物 -->
<div class="section">

  <h2>🔴 提出物</h2>

  <div id="taskList">

    <div class="task" id="task-math">

      <div>
        <p>数学ワーク</p>
        <span>9/16まで　あと1日</span>
      </div>

      <button onclick="addSubmitted('数学ワーク', 'task-math')">
        提出済みに追加
      </button>

    </div>


    <div class="task" id="task-english">

      <div>
        <p>英語プリント</p>
        <span>9/19まで　あと4日</span>
      </div>

      <button onclick="addSubmitted('英語プリント', 'task-english')">
        提出済みに追加
      </button>

    </div>

  </div>

</div>


<!-- 提出済み -->
<div class="section">

  <h2>🔵 提出済み</h2>

  <div id="submittedList">

    <!-- ここに提出済みが移動する -->

  </div>

</div>


  <!-- 提出遅れ -->
  <div class="section">
    <h2>🟡 提出遅れ</h2>

    <div class="late-task">

      <div>
        <p>歴史ノート</p>
        <span>9/14　1日遅れ</span>
      </div>

      <button onclick="lateSubmit('歴史ノート')">
        遅れて提出
      </button>

      <button onclick="showConfirm('歴史ノート')">
        確認
      </button>

    </div>
  </div>


  <!-- 確認画面 -->
  <div id="confirmScreen" class="confirm-screen">

    <h2>確認</h2>

    <p id="confirmText"></p>

    <button onclick="back()">
      戻る
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
