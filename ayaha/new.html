
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録｜わすれんぼう</title>
  <link rel="stylesheet" href="new.css">
  <script src="new.js" defer></script>
</head>
<body>
  <main class="register-container">
    <h1>わすれんぼう</h1>
    <p class="subtitle">アカウントを新規登録</p>

    <form id="registerForm">
      <label for="name">名前</label>
      <input type="text" id="name" name="name"
             placeholder="名前を入力" required>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email"
             placeholder="メールアドレスを入力" required>

      <label for="password">パスワード</label>
      <input type="password" id="password" name="password"
             placeholder="パスワードを入力" required minlength="8">

      <!-- <label for="password-confirm">パスワード（確認）</label>
      <input type="password" id="password-confirm"
             name="password-confirm"
             placeholder="もう一度入力" required minlength="8"> -->

      <button type="submit">新規登録</button>
    </form>

    <p class="login-link">
      すでにアカウントをお持ちの方は
      <a href="login.html">ログイン</a>
    </p>
  </main>
</body>
</html>
