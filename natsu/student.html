<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一般生徒ホーム画面</title>
    <link rel="stylesheet" href="student.css">
</head>

<body>

    <!-- ③ 一般生徒ホーム画面 -->
    <div id="homeScreen" class="screen">

        <h1>③ 一般生徒ホーム画面</h1>

        <div class="menu">
            <button onclick="showSubmission()">🔴 提出物</button>
            <button onclick="showBelongings()">🎒 持ち物</button>
        </div>

        <button class="back-button" onclick="goLogin()">戻る</button>

    </div>


    <!-- 提出物確認画面 -->
    <div id="submissionScreen" class="screen hidden">

        <h1>⑤提出物確認画面</h1>

        <div class="detail-box">

            <div class="detail-header">
                学校から
            </div>

            <div id="submissionList" class="detail-list">
                <!-- 提出物がここに表示される -->
            </div>

        </div>

        <button class="back-button" onclick="backHome()">戻る</button>

    </div>


    <!-- ⑥ 持ち物確認画面 -->
    <div id="belongingsScreen" class="screen hidden">

        <h1>⑥持ち物確認画面</h1>

        <div class="belongings-box">

            <!-- 学校から -->
            <div class="belongings-column">

                <div class="column-title">
                    学校から
                </div>

                <div id="schoolBelongingsList" class="belongings-list">
                    <!-- 学校からの持ち物 -->
                </div>

            </div>


            <!-- 自分で追加 -->
            <div class="belongings-column">

                <div class="column-title">
                    自分で追加
                </div>

                <div id="myBelongingsList" class="belongings-list">
                    <!-- 自分で追加した持ち物 -->
                </div>

                <button class="add-button" onclick="addBelonging()">
                    【＋追加】
                </button>

            </div>

        </div>

        <button class="back-button" onclick="backHome()">戻る</button>

    </div>


    <script src="student.js"></script>

</body>
</html>
